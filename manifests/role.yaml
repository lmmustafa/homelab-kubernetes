apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: pod-reader
  namespace: dev

rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
        
  - apiGroups:
      - apps
    resources:
      - deployments 
      - replicasets
    verbs:
      - get
      - list
      - watch
    